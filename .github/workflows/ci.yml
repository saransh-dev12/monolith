name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      OPENAI_API_KEY: placeholder
      OPENAI_MODEL: placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  integration:
    name: Database and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,supavisor,edge-runtime,postgres-meta
      - name: Configure local environment
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o json | jq -r .PUBLISHABLE_KEY)" >> .env.local
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> .env.local
          echo "OPENAI_API_KEY=placeholder" >> .env.local
          echo "OPENAI_MODEL=placeholder" >> .env.local
          echo "PLANNER_DAILY_LIMIT=5" >> .env.local
      - run: supabase db reset
      - run: supabase test db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
